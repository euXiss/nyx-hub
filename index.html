<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/wiki.css">
  <link rel="stylesheet" href="css/transitions.css">
  <style>
    /* Container Principal do Emblema NyX */
    .nyx-hero-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      aspect-ratio: 16 / 6.6;
      max-height: 290px;
      min-height: 185px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      user-select: none;
    }

    /* Névoa Misteriosa e Aura Pulsante ao Redor do Título */
    .nyx-hero-mist-back {
      position: absolute;
      inset: -28px -70px;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 46% 58% at 32% 52%, rgba(196, 24, 40, 0.48) 0%, rgba(196, 24, 40, 0) 72%),
        radial-gradient(ellipse 46% 58% at 68% 48%, rgba(168, 18, 32, 0.46) 0%, rgba(168, 18, 32, 0) 72%),
        radial-gradient(ellipse 36% 48% at 50% 48%, rgba(229, 192, 92, 0.24) 0%, rgba(229, 192, 92, 0) 70%);
      filter: blur(28px);
      animation: nyx-mist-sway 11s ease-in-out infinite alternate;
    }

    .nyx-hero-mist-front {
      position: absolute;
      inset: 22px -45px -16px -45px;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 35% 34% at 26% 74%, rgba(176, 22, 36, 0.32) 0%, transparent 75%),
        radial-gradient(ellipse 38% 34% at 74% 70%, rgba(176, 22, 36, 0.32) 0%, transparent 75%),
        radial-gradient(ellipse 30% 32% at 50% 80%, rgba(229, 192, 92, 0.16) 0%, transparent 75%);
      filter: blur(20px);
      animation: nyx-mist-drift 9s ease-in-out infinite alternate-reverse;
    }

    @keyframes nyx-mist-sway {
      0% { transform: translate(-14px, -6px) scale(0.96); opacity: 0.82; }
      50% { transform: translate(8px, 6px) scale(1.06); opacity: 1; }
      100% { transform: translate(15px, -4px) scale(0.98); opacity: 0.88; }
    }

    @keyframes nyx-mist-drift {
      0% { transform: translate(14px, 5px) scale(1.03); opacity: 0.6; }
      100% { transform: translate(-15px, -6px) scale(0.95); opacity: 0.92; }
    }

    /* SVG Mestre em Alta Precisão */
    .nyx-master-svg {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 3;
      overflow: visible;
      pointer-events: none;
      shape-rendering: geometricPrecision;
    }

    /* Rotação Contínua em Sentido Horário do Círculo Ritualístico */
    .nyx-wheel-rotate {
      transform-origin: 500px 264px;
      animation: nyx-wheel-spin 64s linear infinite;
    }

    @keyframes nyx-wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Camada das Letras com Sombra Volumétrica e Brilho Externo */
    .nyx-typography-layer {
      filter:
        drop-shadow(0 16px 20px rgba(0, 0, 0, 0.96))
        drop-shadow(0 0 18px rgba(212, 175, 55, 0.28))
        drop-shadow(0 0 30px rgba(184, 29, 44, 0.34));
      animation: nyx-title-radiance 5s ease-in-out infinite alternate;
    }

    @keyframes nyx-title-radiance {
      0% {
        filter:
          drop-shadow(0 16px 20px rgba(0, 0, 0, 0.96))
          drop-shadow(0 0 15px rgba(212, 175, 55, 0.22))
          drop-shadow(0 0 26px rgba(184, 29, 44, 0.28));
      }
      100% {
        filter:
          drop-shadow(0 18px 22px rgba(0, 0, 0, 0.97))
          drop-shadow(0 0 26px rgba(242, 204, 104, 0.42))
          drop-shadow(0 0 38px rgba(217, 43, 58, 0.45));
      }
    }

    /* Movimento Orgânico Horizontal + Vertical (y posicionado mais baixo para nunca cobrir o olho) */
    .nyx-vec-n {
      transform-box: fill-box;
      transform-origin: center;
      animation: nyx-drift-n 5.2s ease-in-out infinite;
    }

    .nyx-vec-y {
      transform-box: fill-box;
      transform-origin: center;
      animation: nyx-drift-y 5.8s ease-in-out -1.5s infinite;
    }

    .nyx-vec-x {
      transform-box: fill-box;
      transform-origin: center;
      animation: nyx-drift-x 5.5s ease-in-out -3.0s infinite;
    }

    @keyframes nyx-drift-n {
      0%, 100% { transform: translate(-5px, -8px) rotate(-0.85deg); }
      35% { transform: translate(4px, 5px) rotate(0.55deg); }
      70% { transform: translate(-3px, 7px) rotate(-0.35deg); }
    }

    @keyframes nyx-drift-y {
      0%, 100% { transform: translate(3px, 2px) rotate(0.75deg); }
      40% { transform: translate(-4px, 14px) rotate(-0.7deg); }
      75% { transform: translate(3px, 18px) rotate(0.45deg); }
    }

    @keyframes nyx-drift-x {
      0%, 100% { transform: translate(5px, -7px) rotate(0.75deg); }
      38% { transform: translate(-4px, 7px) rotate(-0.8deg); }
      72% { transform: translate(4px, 4px) rotate(0.4deg); }
    }
  </style>
</head>

              <path d="M 636 204 L 764 374 C 798 404 844 415 892 417 M 774 204 L 626 376"

            <!-- Contorno Duplo Reforçado para Destacar a Letra -->
            <use href="#nyx-shape-x" fill="none" stroke="#240206" stroke-width="3.2" stroke-opacity="0.78" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Barra de Busca (Input Clear with Dissolve) + Botão do Usuário -->
    <div class="w-full max-w-2xl flex flex-col sm:flex-row items-center justify-center gap-3 relative z-10">
      <div class="relative flex-1 w-full">
        <div id="omnisearch-clear-wrap" class="nyx-clear nyx-clear--omni w-full">
          <input type="text" id="omnisearch-input" autocomplete="off">
          <div class="nyx-clear-mirror" aria-hidden="true"></div>
          <div class="nyx-clear-placeholder" aria-hidden="true">Pesquisar no NyX (ou pressione '/')...</div>
          <div class="nyx-clear-glow" aria-hidden="true"></div>
          <button type="button" class="nyx-clear-btn" aria-label="Limpar pesquisa" data-nyx-tip="Limpar busca" data-nyx-tip-side="bottom">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div id="omnisearch-results" class="hidden"></div>
      </div>

      <!-- Menu Suspenso do Usuário -->
      <div id="auth-status" class="relative shrink-0"></div>
    </div>

  </header>

  <!-- Navegação de Abas Centralizada (Tabs Sliding) -->
  <nav class="bg-[#100306]/90 backdrop-blur-md border-b border-[var(--borda-fina)] px-4 py-2 flex justify-center">
    <div id="main-nav-tabs" role="tablist" aria-label="Navegação Principal" class="nyx-tabs nyx-tabs--nav justify-center">
      <span class="nyx-tabs-pill" aria-hidden="true"></span>
      <button role="tab" aria-selected="true" data-tab="wiki" class="tab-btn nyx-tab whitespace-nowrap">Wiki & Cidades</button>
      <button role="tab" aria-selected="false" data-tab="grafo" class="tab-btn nyx-tab whitespace-nowrap">Visualização em Gráfico</button>
      <button role="tab" aria-selected="false" data-tab="canvas" class="tab-btn nyx-tab whitespace-nowrap">Quadro de Pistas</button>
      <button role="tab" aria-selected="false" data-tab="talentos" class="tab-btn nyx-tab whitespace-nowrap">Catálogo de Talentos</button>
      <button role="tab" aria-selected="false" data-tab="ficha" class="tab-btn nyx-tab whitespace-nowrap">Ficha do Personagem</button>
      <button role="tab" aria-selected="false" data-tab="mestre" class="tab-btn nyx-tab whitespace-nowrap">Painel do Mestre</button>
    </div>
  </nav>

  <!-- Conteúdo Dinâmico -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <div id="view-container"></div>
  </main>

  <!-- Contêiner para Modais -->
  <div id="modal-root"></div>

  <script type="module">
    import { initAuth, renderLoginScreen } from './js/modules/auth.js';
    import { initRolesSync, onRoleUpdated, mountMasterPanel } from './js/modules/roles-manager.js';
    import {
      initWikiSync, mountWikiView, getWikiEntries, toggleWikiSecret, refreshWikiUI, onWikiEntriesUpdated
    } from './js/modules/wiki-cms.js';
    import { initOmnisearch } from './js/modules/omnisearch.js';
    import { mountGraphView, unmountGraphView, refreshGraphView } from './js/modules/graph-view.js';
    import { mountCanvasBoard, unmountCanvasBoard } from './js/modules/canvas-board.js';
    import {
      bindSlidingTabs, moveSlidingPill, bindDissolveClearInput, initNyxWarmTooltips
    } from './js/modules/transitions.js';

    const navTablist = document.getElementById('main-nav-tabs');
    const tabButtons = document.querySelectorAll('.tab-btn');
    const viewContainer = document.getElementById('view-container');
    let currentTab = 'wiki';
    let currentUser = null;

    initNyxWarmTooltips();
    bindDissolveClearInput(document.getElementById('omnisearch-clear-wrap'));
    bindSlidingTabs(navTablist);
    initOmnisearch(() => Boolean(currentUser));

    // =========================================================================
    // MOTOR DE FLUXO LÍQUIDO CONTÍNUO (SANGUE CARMIM & OURO DENTRO DAS LETRAS)
    // =========================================================================
    const liquidMain = document.getElementById('nyx-liquid-flow-main');
    const liquidOverlay = document.getElementById('nyx-liquid-flow-overlay');
    const specularSweep = document.getElementById('nyx-specular-sweep');

    const mainStops = [
      document.getElementById('nyx-liq-0'),
      document.getElementById('nyx-liq-1'),
      document.getElementById('nyx-liq-2'),
      document.getElementById('nyx-liq-3'),
      document.getElementById('nyx-liq-4'),
      document.getElementById('nyx-liq-5')
    ];

    if (liquidMain && liquidOverlay && specularSweep) {
      const animateLiquidFlow = (now) => {
        const t = now * 0.0018;

        // 1. Onda fluida percorrendo as letras
        const waveX1 = 100 + Math.sin(t * 0.95) * 240;
        const waveY1 = 160 + Math.cos(t * 1.15) * 120;
        const waveX2 = 900 + Math.cos(t * 0.9) * 240;
        const waveY2 = 440 + Math.sin(t * 1.1) * 120;

        liquidMain.setAttribute('x1', waveX1.toFixed(1));
        liquidMain.setAttribute('y1', waveY1.toFixed(1));
        liquidMain.setAttribute('x2', waveX2.toFixed(1));
        liquidMain.setAttribute('y2', waveY2.toFixed(1));

        // 2. Pulsação interna das veias de sangue e ouro líquido
        if (mainStops[1] && mainStops[2] && mainStops[3] && mainStops[4]) {
          const s1 = 18 + Math.sin(t * 1.8) * 10;
          const s2 = 40 + Math.cos(t * 1.6) * 11;
          const s3 = 62 + Math.sin(t * 1.7 + 1.2) * 11;
          const s4 = 82 + Math.cos(t * 1.9 + 0.8) * 9;

          mainStops[1].setAttribute('offset', `${s1.toFixed(1)}%`);
          mainStops[2].setAttribute('offset', `${s2.toFixed(1)}%`);
          mainStops[3].setAttribute('offset', `${s3.toFixed(1)}%`);
          mainStops[4].setAttribute('offset', `${s4.toFixed(1)}%`);
        }

        // 3. Corrente cruzada secundária
        const ovlX1 = 880 + Math.sin(t * 1.25 + 1.5) * 260;
        const ovlY1 = 170 + Math.cos(t * 1.0) * 130;
        const ovlX2 = 120 + Math.cos(t * 1.2) * 260;
        const ovlY2 = 430 + Math.sin(t * 0.95) * 130;

        liquidOverlay.setAttribute('x1', ovlX1.toFixed(1));
        liquidOverlay.setAttribute('y1', ovlY1.toFixed(1));
        liquidOverlay.setAttribute('x2', ovlX2.toFixed(1));
        liquidOverlay.setAttribute('y2', ovlY2.toFixed(1));

        // 4. Feixe de brilho especular deslizando continuamente
        const sweepCycle = (now * 0.00034) % 1;
        const sweepStart = -220 + sweepCycle * 1350;
        specularSweep.setAttribute('x1', sweepStart.toFixed(1));
        specularSweep.setAttribute('x2', (sweepStart + 240).toFixed(1));

        requestAnimationFrame(animateLiquidFlow);
      };

      requestAnimationFrame(animateLiquidFlow);
    }

    // =========================================================================
    // RASTREAMENTO INTERATIVO DO OLHO CENTRAL (Mouse + Clique/Toque Mobile)
    // =========================================================================
    const occultEye = document.getElementById('nyx-occult-eye');
    const eyePupil = document.getElementById('nyx-eye-pupil');

    if (occultEye && eyePupil) {
      const MAX_X = 16;
      const MAX_Y = 7.5;
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      const updateEyeGaze = (clientX, clientY) => {
        const eyeRect = occultEye.getBoundingClientRect();
        const eyeCenterX = eyeRect.left + eyeRect.width / 2;
        const eyeCenterY = eyeRect.top + eyeRect.height / 2;

        const dx = clientX - eyeCenterX;
        const dy = clientY - eyeCenterY;
        const distance = Math.hypot(dx, dy);

        if (distance > 1) {
          const intensity = Math.min(1, distance / 240);
          targetX = (dx / distance) * MAX_X * intensity;
          targetY = (dy / distance) * MAX_Y * intensity;
        } else {
          targetX = 0;
          targetY = 0;
        }
      };

      window.addEventListener('pointermove', (e) => {
        updateEyeGaze(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        updateEyeGaze(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches[0]) {
          updateEyeGaze(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) {
          updateEyeGaze(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      const animatePupil = () => {
        currentX += (targetX - currentX) * 0.15;
        currentY += (targetY - currentY) * 0.15;
        eyePupil.setAttribute('transform', `translate(${currentX.toFixed(2)}, ${currentY.toFixed(2)})`);
        requestAnimationFrame(animatePupil);
      };
      requestAnimationFrame(animatePupil);
    }

    // =========================================================================
    // NAVEGAÇÃO DE ABAS E SINCRONIZAÇÃO DO NYX
    // =========================================================================
    function switchTab(tabName) {
      if (currentTab === 'grafo' && tabName !== 'grafo') unmountGraphView();
      if (currentTab === 'canvas' && tabName !== 'canvas') unmountCanvasBoard();

      currentTab = tabName;
      tabButtons.forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.setAttribute('aria-selected', String(isActive));
        if (isActive) moveSlidingPill(navTablist, btn, false);
      });

      if (!currentUser) {
        unmountGraphView();
        unmountCanvasBoard();
        renderLoginScreen(viewContainer);
        return;
      }

      if (tabName === 'wiki') {
        mountWikiView(viewContainer);
      } else if (tabName === 'grafo') {
        mountGraphView(viewContainer);
      } else if (tabName === 'canvas') {
        mountCanvasBoard(viewContainer);
      } else if (tabName === 'mestre') {
        mountMasterPanel(viewContainer, getWikiEntries(), async (wikiId) => {
          await toggleWikiSecret(wikiId);
        });
      } else {
        viewContainer.innerHTML = `
          <div class="bg-[var(--bg-card)] border border-[var(--borda-fina)] rounded-xl p-6 shadow-xl text-center">
            <h2 class="text-xl font-bold text-[var(--dourado)] mb-2">Módulo: ${tabName.toUpperCase()}</h2>
            <p class="text-sm text-[var(--texto-mutado)]">Sessão autenticada. Pronto para plugar este módulo na próxima etapa.</p>
          </div>
        `;
      }
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    onRoleUpdated(() => {
      if (!currentUser) return;
      if (currentTab === 'wiki') refreshWikiUI();
      if (currentTab === 'grafo') refreshGraphView();
      if (currentTab === 'mestre') {
        mountMasterPanel(viewContainer, getWikiEntries(), async (wikiId) => {
          await toggleWikiSecret(wikiId);
        });
      }
    });

    onWikiEntriesUpdated(() => {
      if (!currentUser) return;
      if (currentTab === 'grafo') refreshGraphView();
      if (currentTab === 'mestre') {
        mountMasterPanel(viewContainer, getWikiEntries(), async (wikiId) => {
          await toggleWikiSecret(wikiId);
        });
      }
    });

    initAuth(
      (user) => {
        currentUser = user;
        initRolesSync(user);
        initWikiSync();
        switchTab(currentTab);
      },
      () => {
        currentUser = null;
        initRolesSync(null);
        unmountGraphView();
        unmountCanvasBoard();
        renderLoginScreen(viewContainer);
      }
    );
  </script>
</body>
</html>
